name: Dust Road checks
on:
  push:
    paths: ['dust-road/**', '.github/workflows/dust-road.yml']
  pull_request:
    paths: ['dust-road/**', '.github/workflows/dust-road.yml']
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: dust-road
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - run: npm test
      - run: node --check src/main.js && node --check src/renderer.js && node --check src/world.js && node --check server.mjs
